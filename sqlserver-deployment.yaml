apiVersion: apps/v1
kind: Deployment
metadata:
  name: sqlserver-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sqlserver
  template:
    metadata:
      labels:
        app: sqlserver
    spec:
      securityContext:
        fsGroup: 1000
      containers:
      - name: sqlserver
        image: mcr.microsoft.com/mssql/server:2022-latest
        ports:
        - containerPort: 1433
        env:
        - name: ACCEPT_EULA
          value: "Y"
        - name: SA_PASSWORD
          value: "YourStrong!Password"
        - name: MSSQL_PID
          value: "Express"
      volumes:
      - name: mssql-data
        persistentVolumeClaim:
          claimName: sqlserver-pvc
      - name: scripts
        configMap:
          name: sqlserver-scripts
          defaultMode: 0777
