apiVersion: v1
kind: Pod
metadata:
  name: rabbitmq-pod
  labels:
    app: rabbitmq
spec:
  containers:
  - name: rabbitmq
    image: masstransit/rabbitmq
    ports:
    - containerPort: 5672  
    - containerPort: 15672
    env:
    - name: RABBITMQ_DEFAULT_USER
      value: "guest"
    - name: RABBITMQ_DEFAULT_PASS
      value: "guest"
