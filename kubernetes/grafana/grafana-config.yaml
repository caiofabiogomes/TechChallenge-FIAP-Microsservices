apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasource
data:
  datasources.yaml: |
      apiVersion: 1

      datasources:
        - name: prometheus
          type: prometheus
          access: proxy
          url: http://prometheus-service:9090
          isDefault: true

---

apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-config
data:
  dashboards.yaml: |
    apiVersion: 1
    providers:
      - name: 'default'
        orgId: 1
        folder: ''
        type: file
        disableDeletion: false
        editable: true
        options:
          path: /var/lib/grafana/dashboards
