apiVersion: v1
kind: ConfigMap
metadata:
  name: kong-config
data:
  kong.yml: |
    _format_version: "3.0"

    services:
      - name: contacts-producer-service
        host: contacts-producer-service
        port: 8081
        protocol: http
        routes:
          - name: contacts-producer-service
            paths: ["/"]
            protocols:
              - http 

      - name: azure-function-service
        host: get-contacts-service
        port: 80
        protocol: http
        routes:
          - name: azure-function-route
            paths: ["/api/GetContactsFunction"]
            strip_path: false

    plugins:
      - name: rate-limiting
        config:
          second: 5 
          minute: 10
          hour: 1000
          limit_by: consumer
      - name: prometheus
        config:
          per_consumer: true
          status_code_metrics: true
          latency_metrics: true
          bandwidth_metrics: true
          upstream_health_metrics: true

